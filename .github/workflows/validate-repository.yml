name: Validate repository

on:
  pull_request:
    paths:
      - "metadata/**"
      - "curriculum/**"
      - "tools/**"
      - "docs/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/validate-repository.yml"
  push:
    branches: [main]
    paths:
      - "metadata/**"
      - "curriculum/**"
      - "tools/**"
      - "docs/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/validate-repository.yml"
  workflow_dispatch:
    inputs:
      strict_repository:
        description: "Run strict repository validation"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: validate-repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-repository:
    name: Validate learner-facing curriculum files
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate metadata first
        run: make validate-metadata

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          # Non-strict by default for PRs (partial migration)
          strict="${{ github.event.inputs.strict_repository || 'false' }}"
          if [ "$strict" = "true" ]; then
            make validate-repository
          else
            make validate-repository STRICT_REPOSITORY=0
          fi

      - name: Run Go tests when curriculum code exists
        shell: bash
        run: |
          set -euo pipefail
          if find curriculum tools -name "*.go" | grep -q .; then
            go test ./...
          else
            echo "No Go source files found yet"
          fi
